<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema VTV</title>
    <meta name="description" content="Ventas, caja y reportes de la planta de VTV." />
    <meta name="theme-color" content="#16a34a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/iconos/favicon-32.png" />
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <script>
      // Tema antes de pintar (lo mantiene src/compartido/componentes/ProveedorTema.tsx): "vtv-tema" o el del sistema.
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem("vtv-tema");
        } catch (e) {}
        if (tema !== "light" && tema !== "dark") {
          tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.classList.toggle("dark", tema === "dark");
        document.documentElement.style.colorScheme = tema;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
